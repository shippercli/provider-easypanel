settings:
  namespace_roots:
    src: ShipperCli\ProviderEasyPanel
    tests: ShipperCli\ProviderEasyPanel\Tests

coverage_xml: .parity/per-test

test:
  command: "XDEBUG_MODE=coverage vendor/bin/phpunit {test_abs} --coverage-filter=src --coverage-clover={coverage} --colors=never"
  coverage: ".parity/tmp/{slug}.xml"
  reports: ".parity/per-test"

structure:
  - name: EasyPanel provider
    paths:
      source: src
      test: tests
    rules: []
