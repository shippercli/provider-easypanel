name: EasyPanel Live E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-e2e.yml
      - composer.json
      - composer.lock
      - src/**
      - tests/live-e2e.php

permissions:
  contents: read

concurrency:
  group: easypanel-live-demo
  cancel-in-progress: false

jobs:
  disposable-lifecycle:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/audit/2026-10-14-fixes')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
      EASYPANEL_AUTH_TOKEN: ${{ secrets.EASYPANEL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Deploy, verify and clean up disposable app
        run: php tests/live-e2e.php
