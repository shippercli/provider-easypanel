name: EasyPanel Live E2E

on:
  workflow_dispatch:
    inputs:
      disposable-lifecycle:
        description: Deploy and destroy an isolated EasyPanel app
        type: boolean
        default: false
      probe-create-env:
        description: Check ownership marker persistence on a disposable app
        type: boolean
        default: false
      recover-failed-probe:
        description: Recover the disposable project from run 43218511043
        type: boolean
        default: false
      check-public-api:
        description: Check the documented read-only project inventory route
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - composer.json
      - src/**
      - tests/live-e2e.php

permissions:
  contents: read

concurrency:
  group: easypanel-live-demo
  cancel-in-progress: false

jobs:
  deploy-demo:
    if: github.ref == 'refs/heads/main' && !inputs.disposable-lifecycle && !inputs.probe-create-env && !inputs.recover-failed-probe && !inputs.check-public-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
      EASYPANEL_AUTH_TOKEN: ${{ secrets.EASYPANEL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Apply and verify dedicated demo
        run: php tests/live-e2e.php

  check-public-api:
    if: github.event_name == 'workflow_dispatch' && inputs.check-public-api && !inputs.disposable-lifecycle && github.ref == 'refs/heads/codex/easypanel-create-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
      EASYPANEL_AUTH_TOKEN: ${{ secrets.EASYPANEL_AUTH_TOKEN }}
    steps:
      - name: Check the public inventory route
        run: |
          test -n "$EASYPANEL_URL"
          test -n "$EASYPANEL_AUTH_TOKEN"
          response=$(curl --disable --silent --max-time 20 --proto '=https' \
            --output /dev/null --write-out '%{http_code} %{content_type}' \
            --header "Authorization: Bearer $EASYPANEL_AUTH_TOKEN" \
            "${EASYPANEL_URL%/}/api/listProjects")
          echo "Public inventory HTTP status: ${response%% *}"
          [[ "$response" == "200 application/json"* ]]
      - name: Check the configured service domain shape
        run: |
          set -o pipefail
          curl --disable --silent --fail --max-time 20 --proto '=https' \
            --header "Authorization: Bearer $EASYPANEL_AUTH_TOKEN" \
            "${EASYPANEL_URL%/}/api/getServiceDomain" \
            | jq -ce 'if type == "object" then {
                shape: type,
                domain_fields: [to_entries[] | select(
                  (.key | test("^[A-Za-z]{0,32}[Dd]omain[A-Za-z]{0,16}$"))
                  and (.value | type == "string" and length > 0)
                ) | .key]
              } else {shape: type} end' 2>/dev/null

  probe-create-env:
    if: github.event_name == 'workflow_dispatch' && !inputs.check-public-api && !inputs.disposable-lifecycle && (inputs.probe-create-env || inputs.recover-failed-probe) && github.ref == 'refs/heads/codex/easypanel-create-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
      EASYPANEL_AUTH_TOKEN: ${{ secrets.EASYPANEL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Check environment persistence at app creation
        if: inputs.probe-create-env && !inputs.recover-failed-probe
        run: php tests/live-create-env.php
      - name: Recover the failed probe
        if: inputs.recover-failed-probe
        run: php tests/live-create-env.php --recover-failed-probe

  disposable-lifecycle:
    if: github.event_name == 'workflow_dispatch' && inputs.disposable-lifecycle && !inputs.probe-create-env && !inputs.recover-failed-probe && !inputs.check-public-api && github.ref == 'refs/heads/codex/easypanel-create-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
      EASYPANEL_AUTH_TOKEN: ${{ secrets.EASYPANEL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php tests/live-e2e.php --disposable
