name: EasyPanel Live E2E

on:
  workflow_dispatch:
    inputs:
      probe-create-env:
        description: Check ownership marker persistence on a disposable app
        type: boolean
        default: false
      recover-failed-probe:
        description: Recover the disposable project from run 43213872024
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - composer.json
      - src/**
      - tests/live-e2e.php

permissions:
  contents: read

concurrency:
  group: easypanel-live-demo
  cancel-in-progress: false

jobs:
  deploy-demo:
    if: github.ref == 'refs/heads/main' && !inputs.probe-create-env && !inputs.recover-failed-probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
      EASYPANEL_AUTH_TOKEN: ${{ secrets.EASYPANEL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Apply and verify dedicated demo
        run: php tests/live-e2e.php

  probe-create-env:
    if: github.event_name == 'workflow_dispatch' && (inputs.probe-create-env || inputs.recover-failed-probe) && github.ref == 'refs/heads/codex/easypanel-create-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
      EASYPANEL_AUTH_TOKEN: ${{ secrets.EASYPANEL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Check environment persistence at app creation
        if: inputs.probe-create-env && !inputs.recover-failed-probe
        run: php tests/live-create-env.php
      - name: Recover the failed probe
        if: inputs.recover-failed-probe
        run: php tests/live-create-env.php --recover-failed-probe
