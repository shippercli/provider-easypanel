name: EasyPanel Live E2E

on:
  workflow_dispatch:
    inputs:
      published:
        description: Exercise the published Composer and Action install paths
        type: boolean
        default: false
      source:
        description: Source to deploy on the disposable target
        type: choice
        options: [image, git]
        default: image
      worker:
        description: Exercise a disposable queue worker with the inline Dockerfile fixture
        type: boolean
        default: false
      scheduler:
        description: Exercise scheduled Box scripts with the public Git fixture
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/live-e2e.yml
      - composer.json
      - composer.lock
      - src/**
      - tests/live-e2e.php

permissions:
  contents: read

concurrency:
  group: easypanel-live-demo
  cancel-in-progress: false

jobs:
  reject-worker-and-scheduler:
    if: github.event_name == 'workflow_dispatch' && inputs.worker && inputs.scheduler
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '::error::Dispatch with either worker or scheduler enabled.'
          exit 1

  disposable-lifecycle:
    if: >-
      inputs.published != true && !(inputs.worker && inputs.scheduler) &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/audit/2026-10-14-fixes' ||
         github.ref == 'refs/heads/codex/easypanel-public-git' ||
         github.ref == 'refs/heads/codex/easypanel-worker-live' ||
         github.ref == 'refs/heads/codex/easypanel-scheduler-live')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
      EASYPANEL_AUTH_TOKEN: ${{ secrets.EASYPANEL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Deploy, verify and clean up disposable app
        env:
          SHIPPER_E2E_SOURCE: ${{ inputs.scheduler && 'git' || inputs.source || 'image' }}
          SHIPPER_E2E_SCHEDULER: ${{ inputs.scheduler }}
          SHIPPER_E2E_WORKER: ${{ inputs.worker }}
        run: php tests/live-e2e.php

  published-lifecycle:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.published && !(inputs.worker && inputs.scheduler) &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/easypanel-scheduler-release')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        installation: [composer, action]
    steps:
      - uses: actions/checkout@v5
      - name: Prepare the disposable project configuration
        env:
          SHIPPER_E2E_SOURCE: ${{ inputs.scheduler && 'scheduler' || inputs.worker && 'worker' || inputs.source }}
        run: |
          name="e$(openssl rand -hex 6)"
          echo "SHIPPER_E2E_PROJECT=$name" >> "$GITHUB_ENV"
          mkdir published-fixture
          cat > published-fixture/shipper.yml <<'YAML'
          providers:
            easypanel:
              url: "${EASYPANEL_URL}"
              auth_token: "${EASYPANEL_AUTH_TOKEN}"
              managed_prefix: "s-"
              service_name: "web"
              source:
          YAML
          case "$SHIPPER_E2E_SOURCE" in
            worker)
              cat >> published-fixture/shipper.yml <<'YAML'
                type: dockerfile
                dockerfile: |
          YAML
              sed 's/^/        /' tests/fixtures/worker.Dockerfile >> published-fixture/shipper.yml
              ;;
            image)
              cat >> published-fixture/shipper.yml <<'YAML'
                type: image
                image: "nginx:alpine"
          YAML
              ;;
            git|scheduler)
              fixture=public-git
              if [ "$SHIPPER_E2E_SOURCE" = scheduler ]; then fixture=scheduler; fi
              cat >> published-fixture/shipper.yml <<YAML
                type: git
                repo: "https://github.com/shippercli/provider-easypanel.git"
                ref: "${GITHUB_REF_NAME}"
          YAML
              printf '      path: "/tests/fixtures/%s"\n' "$fixture" >> published-fixture/shipper.yml
              ;;
            *) exit 1 ;;
          esac
          cat >> published-fixture/shipper.yml <<YAML
          projects:
            $name:
              provider: easypanel
          YAML
          if [ "$SHIPPER_E2E_SOURCE" = worker ]; then
            cat >> published-fixture/shipper.yml <<'YAML'
              queues:
                default:
                  enabled: true
          YAML
          fi
          if [ "$SHIPPER_E2E_SOURCE" = scheduler ]; then
            nonce="$(openssl rand -hex 12)"
            digest="$(printf '["%s","v1"]' "$name" | sha256sum | cut -c1-20)"
            target="http://s-${name}-v1-${digest}_web/record/cron/$nonce"
            echo "SHIPPER_E2E_CRON_NONCE=$nonce" >> "$GITHUB_ENV"
            cat >> published-fixture/shipper.yml <<YAML
              cron:
                sample:
                  frequency: "* * * * *"
                  command: "curl --max-time 5 -fsS '$target' || wget -T 5 -qO- '$target'"
          YAML
          fi
          cat >> published-fixture/shipper.yml <<'YAML'
              profiles:
                v1:
                  branch: main
          YAML
      - uses: shivammathur/setup-php@v2
        if: matrix.installation == 'composer'
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install Shipper through Composer
        if: matrix.installation == 'composer'
        env:
          COMPOSER_HOME: ${{ runner.temp }}/shipper-composer
        run: |
          composer global require --no-interaction --prefer-dist shippercli/cli:1.0.4 shippercli/provider-easypanel:2.0.3
          echo "$COMPOSER_HOME/vendor/bin" >> "$GITHUB_PATH"
      - name: Install and validate through the published Shipper Action
        if: matrix.installation == 'action'
        uses: shippercli/actions/.github/actions/shipper@2649f5132e10d405dddd77198e42c67035cfff4c
        env:
          EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
          EASYPANEL_AUTH_TOKEN: ${{ secrets.EASYPANEL_AUTH_TOKEN }}
        with:
          command: validate
          cli-version: '1.0.4'
          providers: shippercli/provider-easypanel:2.0.3
          working-directory: published-fixture
      - name: Verify published deployment, HTTPS, and cleanup
        working-directory: published-fixture
        env:
          SHIPPER_E2E_SOURCE: ${{ inputs.scheduler && 'git' || inputs.source }}
          SHIPPER_E2E_SCHEDULER: ${{ inputs.scheduler }}
          SHIPPER_E2E_WORKER: ${{ inputs.worker }}
          EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
          EASYPANEL_AUTH_TOKEN: ${{ secrets.EASYPANEL_AUTH_TOKEN }}
        run: |
          export SHIPPER_E2E_BIN="$(command -v shipper)"
          test -x "$SHIPPER_E2E_BIN"
          php ../tests/live-e2e.php
