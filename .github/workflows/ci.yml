name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Validate package
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate optimized autoloading
        run: composer dump-autoload --optimize --strict-psr
      - name: Run tests
        run: composer test
      - name: Verify provider distribution archives
        run: python3 tests/package/verify-dist.py
      - name: Audit dependencies
        run: composer audit --locked --no-interaction
      - name: Verify real HTTP response boundaries
        run: python3 tests/http/test_responses.py
      - name: Verify application environment readback over HTTP
        run: python3 tests/http/test_environment_readback.py
      - name: Verify worker and scheduler environment readback over HTTP
        run: python3 tests/http/test_workload_readback.py
